name: hello-world
description: Compose a Claude writer, Codex reviewer and shell gates into a release-notes workflow
providers:
  claude:
    command: npx
    args: ["-y", "@agentclientprotocol/claude-agent-acp"]
    model: claude-sonnet-5
  codex:
    command: npx
    args: ["-y", "@agentclientprotocol/codex-acp@2.5.0"]
    model: gpt-6-luna
mcpServers:
  issue_tracker:
    command: node
    args: [tools/release.mjs]
vars:
  PRODUCT_NAME: Taskboard
  RELEASE_VERSION: { file: release.txt }
  RELEASE_NOTES_STYLE: { resource: "mem://release-style", mcpServer: issue_tracker }
steps:
  - id: check-inputs
    mcpServers: []
    run:
      command: sh
      args: [scripts/check-inputs.sh]
    on:
      failure: FAIL
  - id: collect
    provider: claude
    mcpServers:
      issue_tracker: { allow: [list_issues] }
    do: |
      Prepare release notes for {{PRODUCT_NAME}} version {{RELEASE_VERSION}}.
      Call the issue_tracker server's list_issues tool with the trimmed release version.
      Save only issues whose status is shipped to issues.json in the working
      directory, as a JSON array preserving every field from the tool response.
      This file is the hand-off to the drafting step. Do not invent issues or
      read the server's source/data instead of calling MCP. If repairing a failed
      check, fetch the issues again and replace the file.
      Do not edit input files, helper scripts, MCP data, prompts or runbooks.
  - id: draft
    provider: claude
    mcpServers: []
    do: { file: templates/draft.md }
  - id: review
    provider: codex
    mcpServers: []
    do: { file: templates/review.md }
  - id: verify
    mcpServers: []
    run:
      command: sh
      args: [scripts/check.sh]
    on:
      success: END
      failure:
        target: collect
        maxAttempts: 2
        fallback: FAIL
