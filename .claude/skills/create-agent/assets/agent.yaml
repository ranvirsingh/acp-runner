name: CHANGEME
description: "Brief summary of what this agent does and when to run it"
provider: claude
model: claude-sonnet-5
providers:
  fallback: [claude, codex, gemini]
  onSpawnError: swap

vars:
  standard: every exported function has a test and passes verification

steps:
  - id: implement
    do: |
      CHANGEME: state the work this step must produce, and the files it must
      leave behind for the steps after it.

  - id: review
    do: |
      Review the work against this standard: {{standard}}.
      Fix what fails it. Change nothing else.

  - id: verify
    run: npm test
    on:
      success: report
      failure:
        target: review
        maxAttempts: 3
        fallback: alert_failure

  - id: alert_failure
    run: echo "Verification failed after max retry attempts"
    on:
      success: FAIL

  - id: report
    do: |
      The gate passed. In under ten lines, summarize what changed and what proves it.
    on:
      success: END
